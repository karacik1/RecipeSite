name: Run Tests

# Когда запускать этот воркфлоу
on:
  push:
    branches: [ "main" ]   # при пуше в main
  pull_request:
    branches: [ "main" ]   # и при создании pull request в main

jobs:
  test:
    runs-on: ubuntu-latest   # GitHub предоставит виртуальную машину с Ubuntu

    steps:
      # 1. Скачать твой код на эту машину
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Установить Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # Можно указать '3.14' или '3.x' для последней версии

      # 3. Установить зависимости из requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django   # Если их нет в requirements.txt

      # 4. Запустить тесты
      - name: Run pytest
        run: pytest
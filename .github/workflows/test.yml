name: Run Tests
on:
  push:
    branches: [ "main", "features/**", "feature/**" ]
  pull_request:
    branches: [ "main" ]   #while pull request в main

jobs:
  test:
    runs-on: ubuntu-latest   # GitHub Ubuntu

    steps:
      # 1. download cpode
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django   # Если их нет в requirements.txt

      - name: Run pytest
        run: pytest